[project]
name = "rumour-pressure"
version = "0.1.0"
description = "Does online rumour lead, lag or mirror prediction-market prices on culture questions?"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1",
    "httpx>=0.28.1",
    "pydantic>=2.8",
    "pyyaml>=6.0.3",
    "typer>=0.12",
    "websockets>=17.3",
]

[project.scripts]
rp = "rumour_pressure.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rumour_pressure"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live and not slow'"
markers = [
    "live: hits real external APIs (opt-in: -m live)",
    "slow: long-running, e.g. stance accuracy against labels (opt-in: -m slow)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
